receivers:
  # FortiGate: container listens on 5514/udp; Compose maps host UDP 514 -> 5514.
  # Endpoint Central: host TCP 5515 -> container 5515. Unprivileged inside the image.
  syslog/fortigate:
    udp:
      listen_address: "0.0.0.0:5514"
      one_log_per_packet: true
    protocol: rfc5424

  syslog/endpoint-central:
    tcp:
      listen_address: "0.0.0.0:5515"
    protocol: rfc5424

exporters:
  # private_key from Docker/Podman secret file (distroless image has no /bin/sh).
  # Key file must be one line (Send-Your-Data API key only); avoid trailing junk.
  coralogix/fortigate:
    domain: ${env:CORALOGIX_DOMAIN}
    private_key: ${file:/run/secrets/coralogix_key}
    application_name: ${env:CORALOGIX_FORTIGATE_APPLICATION}
    subsystem_name: ${env:CORALOGIX_FORTIGATE_SUBSYSTEM}
    timeout: 30s

  coralogix/endpoint-central:
    domain: ${env:CORALOGIX_DOMAIN}
    private_key: ${file:/run/secrets/coralogix_key}
    application_name: ${env:CORALOGIX_ENDPOINT_CENTRAL_APPLICATION}
    subsystem_name: ${env:CORALOGIX_ENDPOINT_CENTRAL_SUBSYSTEM}
    timeout: 30s

service:
  pipelines:
    logs/fortigate:
      receivers: [syslog/fortigate]
      exporters: [coralogix/fortigate]

    logs/endpoint-central:
      receivers: [syslog/endpoint-central]
      exporters: [coralogix/endpoint-central]
