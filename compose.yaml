# Syslog -> Coralogix (OpenTelemetry Collector).
#
# Three isolated listeners. No custom OTel parsing, operators, or processors.
# Coralogix receives the records and does vendor parsing.
#
#   FortiGate 400F  UDP  ${FORTIGATE_SYSLOG_UDP_PORT}  -> app/subsystem from .env (RFC5424)
#   Ruckus SZ AP    UDP  ${RUCKUS_SYSLOG_UDP_PORT}     -> app/subsystem from .env (RFC3164)
#   MikroTik        UDP  ${MIKROTIK_SYSLOG_UDP_PORT}   -> app/subsystem from .env (RFC3164)
#
# Credentials are NEVER in this file or in the image. The Coralogix key is a
# read-only Docker/Podman secret via CORALOGIX_KEY_FILE in .env.
# The contrib image is distroless (no /bin/sh) — key is read via ${file:...}
# in config.yaml, not a shell wrapper.
#
#   cp .env.example .env      # edit the values
#   docker compose --env-file .env up -d
#   # Podman Desktop: same command (compose talks to the Podman engine)
#
name: syslog-coralogix-tap

services:
  syslog-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    environment:
      CORALOGIX_DOMAIN: ${CORALOGIX_DOMAIN:?set CORALOGIX_DOMAIN}
      CORALOGIX_FORTIGATE_APPLICATION: ${CORALOGIX_FORTIGATE_APPLICATION:?set CORALOGIX_FORTIGATE_APPLICATION}
      CORALOGIX_FORTIGATE_SUBSYSTEM: ${CORALOGIX_FORTIGATE_SUBSYSTEM:?set CORALOGIX_FORTIGATE_SUBSYSTEM}
      CORALOGIX_RUCKUS_APPLICATION: ${CORALOGIX_RUCKUS_APPLICATION:?set CORALOGIX_RUCKUS_APPLICATION}
      CORALOGIX_RUCKUS_SUBSYSTEM: ${CORALOGIX_RUCKUS_SUBSYSTEM:?set CORALOGIX_RUCKUS_SUBSYSTEM}
      CORALOGIX_MIKROTIK_APPLICATION: ${CORALOGIX_MIKROTIK_APPLICATION:?set CORALOGIX_MIKROTIK_APPLICATION}
      CORALOGIX_MIKROTIK_SUBSYSTEM: ${CORALOGIX_MIKROTIK_SUBSYSTEM:?set CORALOGIX_MIKROTIK_SUBSYSTEM}
    ports:
      # Host ports are unprivileged by default so rootless Podman / Docker
      # Desktop work without extra privileges. Point appliances at these ports.
      - "0.0.0.0:${FORTIGATE_SYSLOG_UDP_PORT:?set FORTIGATE_SYSLOG_UDP_PORT}:5514/udp"
      - "0.0.0.0:${RUCKUS_SYSLOG_UDP_PORT:?set RUCKUS_SYSLOG_UDP_PORT}:5515/udp"
      - "0.0.0.0:${MIKROTIK_SYSLOG_UDP_PORT:?set MIKROTIK_SYSLOG_UDP_PORT}:5516/udp"
    volumes:
      - ./config.yaml:/etc/otelcol-contrib/config.yaml:ro
    secrets:
      - coralogix_key
    # Distroless image: default ENTRYPOINT is /otelcol-contrib (no shell).
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

secrets:
  coralogix_key:
    file: ${CORALOGIX_KEY_FILE:?set CORALOGIX_KEY_FILE to the host Coralogix key file path}
